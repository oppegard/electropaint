name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux tests
    # Same-repository branches already run this job on push. Keep the
    # pull_request trigger for a visible check and for forks, but do not run
    # the same commit twice when a local branch is opened as a PR.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shell scripts
        run: shellcheck scripts/generate-fixtures.sh

      - name: Verify source-derived fixtures
        run: |
          npm run fixtures
          git diff --exit-code -- tests/fixtures/reference.json

      - name: Run unit tests
        run: npm test

      - name: Build production site
        run: npm run build
